<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUBYRED | Advance Request</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: dark;
    --ruby: #c02a45;        /* button color */
    --ruby-dark: #a01f38;
    --ruby-text: #ea5b76;   /* red text on dark background */
    --bg: #120e10;
    --card: #1c1619;
    --field: #120e10;
    --text: #f3ecee;
    --muted: #a3979c;
    --line: #382f33;
    --ok: #7fd6a1;
    --err: #ff8f86;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Cairo", Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 440px; }

  /* Language switcher */
  .lang { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .lang button {
    width: auto;
    margin: 0;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
  }
  .lang button:hover { background: transparent; color: var(--text); }
  .lang button[aria-pressed="true"] {
    background: var(--ruby);
    border-color: var(--ruby);
    color: #fff;
  }

  .brand {
    margin: 4px 0 18px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--ruby-text);
    direction: ltr;
    text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 15px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 18px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
  }
  input::placeholder { color: var(--muted); }
  input:focus-visible, button:focus-visible {
    outline: 3px solid rgba(234, 91, 118, .4);
    outline-offset: 1px;
    border-color: var(--ruby-text);
  }
  button {
    width: 100%;
    margin-top: 14px;
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: var(--ruby);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--ruby-dark); }
  button:disabled { background: #3a3135; color: var(--muted); cursor: not-allowed; }
  .link-btn {
    background: none; color: var(--muted); margin-top: 8px;
    font-weight: 600; font-size: 15px;
  }
  .link-btn:hover { background: none; color: var(--ruby-text); }

  /* Employee details */
  .info { margin: 0 0 18px; }
  .info div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .info div:last-child { border-bottom: 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; font-weight: 700; }

  /* Messages */
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-weight: 600; }
  .msg.err { background: #3a1a1f; color: var(--err); }
  .msg.ok  { background: #123222; color: var(--ok); }
  .closed { background: #35270f; color: #f0c06a; border: 1px solid #5a4317; margin-top: 0; margin-bottom: 14px; }

  .hidden { display: none; }
</style>
</head>

<body>
<div class="wrap">

  <!-- Language switcher -->
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="ar">العربية</button>
    <button type="button" data-lang="tr">Türkçe</button>
  </div>

  <div class="brand">RUBYRED</div>
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="sub"></p>

  <!-- Shown when requests are closed -->
  <div id="closedBox" class="msg closed hidden" data-i18n="CLOSED"></div>

  <!-- Step 1: enter code -->
  <div id="step1" class="card">
    <label for="codeInput" data-i18n="codeLabel"></label>
    <input id="codeInput" type="text" inputmode="numeric" autocomplete="off" data-i18n-ph="codePh">
    <button id="searchBtn" data-i18n="searchBtn"></button>
    <div id="msg1" class="msg err hidden"></div>
  </div>

  <!-- Step 2: details + amount -->
  <div id="step2" class="card hidden">
    <dl class="info">
      <div><dt data-i18n="lblCode"></dt><dd id="vCode"></dd></div>
      <div><dt data-i18n="lblName"></dt><dd id="vName"></dd></div>
      <div><dt data-i18n="lblDep"></dt><dd id="vDep"></dd></div>
      <div><dt data-i18n="lblJd"></dt><dd id="vJd"></dd></div>
    </dl>

    <label for="amountInput" data-i18n="amountLabel"></label>
    <input id="amountInput" type="number" inputmode="decimal" min="1" step="any" data-i18n-ph="amountPh">
    <button id="submitBtn" data-i18n="submitBtn"></button>
    <button id="backBtn" class="link-btn" type="button" data-i18n="backBtn"></button>
    <div id="msg2" class="msg hidden"></div>
  </div>
</div>

<script>
  // ============ SETTINGS (only change these two) ============

  // The Web App URL you get from Google Apps Script after deploying
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0-YIxoABq6ZcHc_AeTuiTWtlswGYzj71WLctGO8IcKcjoGyJUzij3MKEsqxxK_wsRpg/exec";

  // Testing only: true = form opens on any day. Set back to false before sharing.
  // (Do the same in Code.gs)
  const TEST_MODE = false;

  // ==========================================================

  // ---------- Translations ----------
  // To add or edit a text, change it here. {amount} is replaced automatically.
  const I18N = {
    en: {
      title: "Advance Request",
      sub: "Requests are open from the 24th to the 26th of each month.",
      codeLabel: "Employee code",
      codePh: "Enter your code",
      searchBtn: "Show my details",
      searching: "Searching...",
      lblCode: "Code",
      lblName: "Name",
      lblDep: "Department",
      lblJd: "JD",
      amountLabel: "Advance amount requested",
      amountPh: "Enter amount",
      submitBtn: "Submit request",
      sending: "Sending...",
      backBtn: "Back",
      errEnterCode: "Enter your code first.",
      errAmount: "Enter a valid amount greater than zero.",
      errConn: "Connection problem. Please try again.",
      success: "Your advance request of {amount} was submitted.",
      // Messages coming from the server (Code.gs)
      CLOSED: "Requests are closed right now. They open from the 24th to the 26th of each month.",
      NOT_FOUND: "This code was not found. Check it and try again.",
      BAD_AMOUNT: "Enter a valid amount greater than zero.",
      DUPLICATE: "You have already submitted an advance request this month.",
      ERROR: "Something went wrong. Please try again."
    },
    ar: {
      title: "طلب سلفة",
      sub: "التسجيل متاح من يوم 24 إلى يوم 26 من كل شهر.",
      codeLabel: "الكود الوظيفي",
      codePh: "اكتب الكود بتاعك",
      searchBtn: "عرض بياناتي",
      searching: "جاري البحث...",
      lblCode: "الكود",
      lblName: "الاسم",
      lblDep: "القسم",
      lblJd: "JD",
      amountLabel: "مبلغ السلفة المطلوب",
      amountPh: "اكتب المبلغ",
      submitBtn: "إرسال الطلب",
      sending: "جاري الإرسال...",
      backBtn: "رجوع",
      errEnterCode: "اكتب الكود الأول.",
      errAmount: "اكتب مبلغ صحيح أكبر من صفر.",
      errConn: "حصلت مشكلة في الاتصال. جرّب تاني.",
      success: "تم تسجيل طلب السلفة بمبلغ {amount} بنجاح.",
      CLOSED: "التسجيل مقفول حالياً. بيفتح من يوم 24 إلى 26 من كل شهر.",
      NOT_FOUND: "الكود ده مش موجود. اتأكد منه وجرّب تاني.",
      BAD_AMOUNT: "اكتب مبلغ صحيح أكبر من صفر.",
      DUPLICATE: "سبق وسجّلت طلب سلفة الشهر ده.",
      ERROR: "حصل خطأ. جرّب تاني."
    },
    tr: {
      title: "Avans Talebi",
      sub: "Talepler her ayın 24 ile 26'sı arasında açıktır.",
      codeLabel: "Personel kodu",
      codePh: "Kodunuzu girin",
      searchBtn: "Bilgilerimi göster",
      searching: "Aranıyor...",
      lblCode: "Kod",
      lblName: "Ad Soyad",
      lblDep: "Departman",
      lblJd: "JD",
      amountLabel: "Talep edilen avans tutarı",
      amountPh: "Tutarı girin",
      submitBtn: "Talebi gönder",
      sending: "Gönderiliyor...",
      backBtn: "Geri",
      errEnterCode: "Önce kodunuzu girin.",
      errAmount: "Sıfırdan büyük geçerli bir tutar girin.",
      errConn: "Bağlantı sorunu. Lütfen tekrar deneyin.",
      success: "{amount} tutarındaki avans talebiniz alındı.",
      CLOSED: "Talepler şu anda kapalı. Her ayın 24 ile 26'sı arasında açılır.",
      NOT_FOUND: "Bu kod bulunamadı. Kontrol edip tekrar deneyin.",
      BAD_AMOUNT: "Sıfırdan büyük geçerli bir tutar girin.",
      DUPLICATE: "Bu ay zaten bir avans talebi gönderdiniz.",
      ERROR: "Bir hata oluştu. Lütfen tekrar deneyin."
    }
  };
  const DIRECTION = { en: "ltr", ar: "rtl", tr: "ltr" };

  const $ = (id) => document.getElementById(id);

  // English is the default. If the person picked a language before, use it.
  let lang = "en";
  try {
    const saved = localStorage.getItem("rubyred_lang");
    if (saved && I18N[saved]) lang = saved;
  } catch (e) {}

  // Get a text in the current language (falls back to English)
  function t(key, params) {
    let text = I18N[lang][key] || I18N.en[key] || key;
    for (const name in (params || {})) text = text.replace("{" + name + "}", params[name]);
    return text;
  }

  // ---------- Messages ----------
  // We save the message key, so the message can be re-translated when the language changes.
  function showMsg(el, key, type, params) {
    el.dataset.key = key;
    el.dataset.params = JSON.stringify(params || {});
    el.textContent = t(key, params);
    el.className = "msg " + type;
  }
  function hideMsg(el) {
    delete el.dataset.key;
    el.className = "msg hidden";
  }
  // Server sends an error code (CLOSED, NOT_FOUND...). Unknown codes become ERROR.
  function serverError(code) {
    return I18N.en[code] ? code : "ERROR";
  }

  // ---------- Apply language to the whole page ----------
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = DIRECTION[lang];
    document.title = "RUBYRED | " + t("title");

    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll(".lang button").forEach((b) => {
      b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
    });
    // Re-translate any message that is currently showing
    document.querySelectorAll(".msg[data-key]").forEach((el) => {
      el.textContent = t(el.dataset.key, JSON.parse(el.dataset.params || "{}"));
    });
  }

  function setLang(newLang) {
    lang = newLang;
    try { localStorage.setItem("rubyred_lang", lang); } catch (e) {}
    applyLang();
  }

  // ---------- Opening days (24th to 26th) ----------
  // Day of the month in Cairo time (not the worker's phone time)
  function todayInCairo() {
    const day = new Intl.DateTimeFormat("en-US", { timeZone: "Africa/Cairo", day: "numeric" }).format(new Date());
    return Number(day);
  }
  function isOpen() {
    if (TEST_MODE) return true;
    const d = todayInCairo();
    return d >= 28 && d <= 30;
  }

  // If closed: show the notice and disable the form
  if (!isOpen()) {
    $("closedBox").classList.remove("hidden");
    $("codeInput").disabled = true;
    $("searchBtn").disabled = true;
  } else {
    // Warm up the server on page load so the first search is fast
    // (Google Apps Script is slow on the first request)
    try { fetch(SCRIPT_URL + "?action=lookup&code=0").catch(() => {}); } catch (e) {}
    $("codeInput").focus();
  }

  // ---------- Step 1: find the employee by code ----------
  async function searchEmployee() {
    const code = $("codeInput").value.trim();
    hideMsg($("msg1"));

    if (!isOpen()) return;
    if (!code) {
      showMsg($("msg1"), "errEnterCode", "err");
      return;
    }

    $("searchBtn").disabled = true;
    $("searchBtn").textContent = t("searching");

    try {
      const res = await fetch(SCRIPT_URL + "?action=lookup&code=" + encodeURIComponent(code));
      const data = await res.json();

      if (!data.ok) {
        showMsg($("msg1"), serverError(data.error), "err");
      } else {
        $("vCode").textContent = data.employee.code;
        $("vName").textContent = data.employee.name;
        $("vDep").textContent  = data.employee.dep;
        $("vJd").textContent   = data.employee.jd;
        $("step1").classList.add("hidden");
        $("step2").classList.remove("hidden");
        $("amountInput").focus();
      }
    } catch (e) {
      showMsg($("msg1"), "errConn", "err");
    }

    $("searchBtn").disabled = false;
    $("searchBtn").textContent = t("searchBtn");
  }

  // ---------- Step 2: send the amount ----------
  async function submitAmount() {
    const amount = Number($("amountInput").value);
    hideMsg($("msg2"));

    if (!isOpen()) return;
    if (!amount || amount <= 0) {
      showMsg($("msg2"), "errAmount", "err");
      return;
    }

    $("submitBtn").disabled = true;
    $("submitBtn").textContent = t("sending");

    try {
      // Sent as plain text (default) so Google Apps Script accepts it without CORS problems
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ code: $("vCode").textContent, amount: amount })
      });
      const data = await res.json();

      if (data.ok) {
        // Success: go straight back to the main page for the next worker
        resetForNext();
        showMsg($("msg1"), "success", "ok", { amount: amount });
        return;
      }
      showMsg($("msg2"), serverError(data.error), "err");
    } catch (e) {
      showMsg($("msg2"), "errConn", "err");
    }

    $("submitBtn").disabled = false;
    $("submitBtn").textContent = t("submitBtn");
  }

  // Back to the main page, clean and ready for a new worker
  function resetForNext() {
    $("step2").classList.add("hidden");
    $("step1").classList.remove("hidden");
    $("codeInput").value = "";
    $("amountInput").value = "";
    $("amountInput").disabled = false;
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = t("submitBtn");
    $("submitBtn").classList.remove("hidden");
    $("backBtn").classList.remove("hidden");
    hideMsg($("msg2"));
    $("codeInput").focus();
  }

  function goBack() {
    $("step2").classList.add("hidden");
    $("step1").classList.remove("hidden");
    $("amountInput").value = "";
    hideMsg($("msg2"));
  }

  // ---------- Wire up buttons ----------
  $("searchBtn").addEventListener("click", searchEmployee);
  $("submitBtn").addEventListener("click", submitAmount);
  $("backBtn").addEventListener("click", goBack);
  $("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") searchEmployee(); });
  $("amountInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitAmount(); });
  document.querySelectorAll(".lang button").forEach((b) => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });

  applyLang();
</script>
</body>
</html>
